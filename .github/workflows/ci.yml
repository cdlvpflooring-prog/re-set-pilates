# Every push and pull request: install, type check and build.
# Pushes to main also publish to Cloudflare, once the CLOUDFLARE_API_TOKEN repository secret exists
# (Cloudflare dashboard → My Profile → API Tokens → "Edit Cloudflare Workers" template → add with
# `gh secret set CLOUDFLARE_API_TOKEN`). Until then the deploy step is skipped and nothing breaks.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to Cloudflare (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f222c8199b93f18eaf125283bb472012
